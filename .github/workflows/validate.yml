---
name: Validate

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint_markdown:
    name: Run markdown linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: |
            README.md

  lint:
    strategy:
      matrix:
        step: [codespell, shellcheck, whitespace, shfmt, ansible, ruff]
    name: Run ${{ matrix.step }} linter
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Setup
        run: dnf -y install codespell make python3-flake8 ShellCheck python3-ansible-lint ansible ruff
      # Fedora 45 retired the shfmt package, so the step below installs the
      # upstream release binary. Upstream publishes no checksum file; the
      # pinned hash is the checksum of the binary this step was written with.
      - name: Install shfmt
        if: matrix.step == 'shfmt'
        run: |
          curl -sSfL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  /usr/local/bin/shfmt" | sha256sum -c
          chmod +x /usr/local/bin/shfmt
      - uses: actions/checkout@v4
      - name: Run ${{ matrix.step }}
        run: make ${{ matrix.step }}-lint

  test:
    strategy:
      matrix:
        step: [bats]
    name: Run ${{ matrix.step }} tests
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Setup
        run: dnf -y install bats make python3-copr python3-coloredlogs
      - uses: actions/checkout@v4
      - name: Run ${{ matrix.step }}
        run: make ${{ matrix.step }}-test
