---
name: Build and Publish OBS Worker Container

"on":
  schedule:
    # Run every Monday at 05:00 UTC
    - cron: '0 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'openhpc-obs-worker.container/**'
      - '.github/scripts/cleanup-ghcr-untagged.sh'
      - '.github/workflows/build-obs-worker-container.yml'
  pull_request:
    branches: [main]
    paths:
      - 'openhpc-obs-worker.container/**'
      - '.github/scripts/cleanup-ghcr-untagged.sh'
      - '.github/workflows/build-obs-worker-container.yml'
  workflow_dispatch:

# The cleanup job deletes untagged image versions. A second run that has
# pushed its per-architecture images but not yet tagged them would lose
# those images, so runs on the same ref must not overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PACKAGE_NAME: obs-worker
  IMAGE_NAME: ${{ github.repository_owner }}/obs-worker

jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    outputs:
      digest-amd64: ${{ steps.export.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.export.outputs.digest-arm64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./openhpc-obs-worker.container
          file: ./openhpc-obs-worker.container/Containerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          outputs: >-
            type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        id: export
        run: |
          echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${IMAGE_NAME}@${{ needs.build.outputs.digest-amd64 }}" \
            "${REGISTRY}/${IMAGE_NAME}@${{ needs.build.outputs.digest-arm64 }}"

  cleanup:
    runs-on: ubuntu-24.04
    needs: publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete untagged image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/cleanup-ghcr-untagged.sh \
            "${{ github.repository_owner }}" "${PACKAGE_NAME}"
