<Directory /repos>
	Options Indexes FollowSymLinks
	IndexOptions NameWidth=* FancyIndexing HTMLTable DescriptionWidth=* SuppressHTMLPreamble Charset=UTF-8
	IndexStyleSheet "/.files/repos.css"
	Require all granted
	HeaderName /HEADER.html
	ReadmeName /FOOTER.html
	IndexIgnore FOOTER.html

	# Ensure UTF-8 encoding for proper emoji display
	AddDefaultCharset UTF-8
	AddCharset UTF-8 .html
</Directory>

# Descriptions for the entries of the top level listing only. Apache
# matches a plain AddDescription argument as a substring of every name,
# so one character is wrapped in brackets to get an exact match.
<DirectoryMatch "^/repos/?$">
	AddDescription "Package repositories for OpenHPC 2.x, 3.x and 4.x" "[O]penHPC"
	AddDescription "Release tarballs of the repositories" "dis[t]"
	AddDescription "OpenHPC 1.3.x package repositories (end of life)" "[o]hpc-1.3"
	AddDescription "Archived repositories of old releases" "[v]ault"
</DirectoryMatch>
