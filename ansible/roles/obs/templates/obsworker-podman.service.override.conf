[Unit]
After=openvpn-client@obs.service
Requires=openvpn-client@obs.service

[Service]
# systemd marks openvpn-client@obs.service as started before the tunnel
# to the OBS server is connected. The worker cannot reach the OBS server
# until the tunnel is connected, so wait for the source server port.
ExecStartPre=/usr/bin/timeout 240 /bin/bash -c 'until /usr/bin/timeout 5 /bin/bash -c "</dev/tcp/{{ obs_repository_server }}/5352" 2>/dev/null; do sleep 2; done'
