[Unit]
After=openvpn-client@obs.service
Requires=openvpn-client@obs.service

[Service]
# systemd marks openvpn-client@obs.service as started before the tunnel
# to the OBS server is connected. The worker cannot reach the OBS server
# until the tunnel is connected. The worker downloads its code from the
# repository server port first, so wait for that port.
ExecStartPre=/usr/bin/timeout 240 /bin/bash -c 'until /usr/bin/timeout 5 /bin/bash -c "</dev/tcp/{{ obs_repository_server }}/5252" 2>/dev/null; do sleep 2; done'
