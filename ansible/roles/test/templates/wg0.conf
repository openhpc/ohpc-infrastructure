# WireGuard tunnel between the jump host and the Huawei repo server.
# The Huawei lab firewall blocks access to obs.openhpc.community:82,
# the traffic to OBS is routed through this tunnel and NATed on the
# jump host.
[Interface]
Address = {{ wireguard_address }}/30
PrivateKey = {{ test_wg_private_key }}
{% if wireguard_listen_port is defined %}
ListenPort = {{ wireguard_listen_port }}
{% endif %}

[Peer]
PublicKey = {{ hostvars[wireguard_peer].test_wg_public_key }}
AllowedIPs = {{ wireguard_peer_allowed_ips | join(', ') }}
{% if wireguard_peer_endpoint is defined %}
Endpoint = {{ wireguard_peer_endpoint }}:{{ wireguard_peer_port }}
PersistentKeepalive = 25
{% endif %}
