- name: Configure ohpc-huawei-repo
  hosts: ohpc_huawei_repo
  gather_facts: true
  vars:
    distro: openEuler_22.03
    disks: sda
    repo: 192.168.29.53
    proxy: 192.168.29.53:3128
    cluster: huawei
    arch: aarch64
    arch_short: aa64

  handlers:
    - name: Include handlers
      ansible.builtin.import_tasks: ../common/handlers.yml

  tasks:
    - name: Include ohpc-common-repo.yml
      ansible.builtin.include_tasks: ohpc-common-repo.yml

    - name: Allow time sync from other test systems
      ansible.builtin.lineinfile:
        path: /etc/chrony.conf
        state: present
        line: "{{ item }}"
      with_items:
        - "allow 192.168.0.0/16"
      notify:
        - Restart chronyd

    - name: Install skopeo
      ansible.builtin.package:
        state: present
        name: skopeo

    - name: Install registry image sync script
      ansible.builtin.copy:
        src: sync-registry-images.sh
        dest: /usr/local/bin/sync-registry-images.sh
        owner: root
        group: root
        mode: "0755"

    - name: Install docker.io mirror configuration
      ansible.builtin.copy:
        src: registries-docker.io-mirror.conf
        dest: /etc/containers/registries.conf.d/docker.io-mirror.conf
        owner: root
        group: root
        mode: "0644"

    - name: Install registry.container definition
      ansible.builtin.copy:
        src: registry.container
        dest: /etc/containers/systemd/registry.container
        owner: root
        group: root
        mode: "0644"
      notify:
        - Systemd daemon-reload

    # Let systemd generate the registry.service unit from the quadlet
    # before trying to enable it.
    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Enable services
      ansible.builtin.service:
        name: "{{ item }}"
        enabled: true
        state: started
      with_items:
        - registry.service

    - name: Enable masquerade in public zone
      ansible.posix.firewalld:
        masquerade: true
        state: enabled
        permanent: true
        zone: public
        immediate: true
      tags:
        - skip_ansible_lint

    - name: Allow impitool access
      ansible.posix.firewalld:
        zone: public
        port: 623/udp
        permanent: true
        state: enabled
        immediate: true
      tags:
        - skip_ansible_lint

    - name: Open firewall ports
      ansible.posix.firewalld:
        zone: public
        port: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      tags:
        - skip_ansible_lint
      with_items:
        - 123/udp
        - 5000/tcp
