# WireGuard tunnel between the jump host and the Huawei repo server.
#
# The Huawei lab firewall blocks access to obs.openhpc.community on
# port 82, and the direct connection to hpc.lenovo.com is too slow. The
# repo server routes the traffic to OBS (44.230.128.55) and to
# hpc.lenovo.com (104.232.228.82) through the tunnel and the jump host
# NATs it to the internet.
#
# The keys are generated on each host on the first run and never leave
# the hosts, only the public keys are exchanged between the two plays.
# The jump host initiates the connection to the repo server. Override
# wireguard_repo_endpoint if the repo server is not reachable from the
# jump host via its default IPv4 address:
#
#   ansible-playbook -i inventory/test \
#     --extra-vars wireguard_repo_endpoint=<address> \
#     roles/test/ohpc-huawei-wireguard.yml

- name: Generate WireGuard keys
  hosts: ohpc_huawei_jumper:ohpc_huawei_repo
  become: true
  gather_facts: true

  tasks:
    - name: Install WireGuard
      ansible.builtin.package:
        state: present
        name: "{{ 'wireguard' if ansible_os_family == 'Debian' else 'wireguard-tools' }}"

    - name: Create /etc/wireguard
      ansible.builtin.file:
        dest: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Generate WireGuard private key
      ansible.builtin.shell: umask 077 && wg genkey > /etc/wireguard/private.key
      args:
        creates: /etc/wireguard/private.key

    - name: Read WireGuard private key
      ansible.builtin.slurp:
        src: /etc/wireguard/private.key
      register: test_wg_private_key_file
      no_log: true

    - name: Derive WireGuard public key
      ansible.builtin.command: wg pubkey
      args:
        stdin: "{{ test_wg_private_key_file.content | b64decode | trim }}"
      register: test_wg_public_key_cmd
      changed_when: false
      no_log: true

    - name: Remember WireGuard keys
      ansible.builtin.set_fact:
        test_wg_private_key: "{{ test_wg_private_key_file.content | b64decode | trim }}"
        test_wg_public_key: "{{ test_wg_public_key_cmd.stdout | trim }}"
      no_log: true

- name: Configure WireGuard on the jump host
  hosts: ohpc_huawei_jumper
  become: true
  gather_facts: false
  vars:
    wireguard_address: 172.31.32.1
    wireguard_peer: "{{ groups['ohpc_huawei_repo'][0] }}"
    wireguard_peer_port: 51820
    wireguard_peer_endpoint: "{{ wireguard_repo_endpoint | default(hostvars[wireguard_peer].ansible_default_ipv4.address) }}"
    wireguard_peer_allowed_ips:
      - 172.31.32.2/32
    # The interface the traffic to OBS leaves on. This is not the
    # default route interface on the jump host.
    wireguard_external_interface: eth0
    wireguard_nat_destinations:
      # obs.openhpc.community
      - 44.230.128.55
      # hpc.lenovo.com
      - 104.232.228.82

  handlers:
    - name: Include handlers
      ansible.builtin.import_tasks: ../common/handlers.yml

  tasks:
    - name: Install WireGuard configuration
      ansible.builtin.template:
        src: wg0.conf
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify:
        - Restart wg-quick@wg0

    - name: Enable IPv4 forwarding in ufw
      ansible.builtin.lineinfile:
        path: /etc/ufw/sysctl.conf
        regexp: '^#?net/ipv4/ip_forward='
        line: net/ipv4/ip_forward=1
      notify:
        - Reload ufw

    - name: Enable IPv4 forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present
        reload: true

    - name: Add NAT for the WireGuard network to ufw
      ansible.builtin.blockinfile:
        path: /etc/ufw/before.rules
        marker: "# {mark} ANSIBLE MANAGED BLOCK (wireguard nat)"
        insertbefore: '^\*filter'
        block: |
          *nat
          :POSTROUTING ACCEPT [0:0]
          -A POSTROUTING -s 172.31.32.0/30 -o {{ wireguard_external_interface }} -j MASQUERADE
          COMMIT
      notify:
        - Reload ufw

    - name: Allow incoming SSH in ufw
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Enable ufw
      community.general.ufw:
        state: enabled

    - name: Allow forwarding from the tunnel to the NAT destinations in ufw
      community.general.ufw:
        rule: allow
        route: true
        interface_in: wg0
        interface_out: "{{ wireguard_external_interface }}"
        to_ip: "{{ item }}"
      with_items: "{{ wireguard_nat_destinations }}"

    - name: Enable wg-quick@wg0
      ansible.builtin.service:
        name: wg-quick@wg0
        enabled: true
        state: started

- name: Configure WireGuard on the Huawei repo server
  hosts: ohpc_huawei_repo
  gather_facts: false
  vars:
    wireguard_address: 172.31.32.2
    wireguard_listen_port: 51820
    wireguard_peer: "{{ groups['ohpc_huawei_jumper'][0] }}"
    # wg-quick installs a route through the tunnel for every entry
    wireguard_peer_allowed_ips:
      - 172.31.32.1/32
      # obs.openhpc.community
      - 44.230.128.55/32
      # hpc.lenovo.com
      - 104.232.228.82/32

  handlers:
    - name: Include handlers
      ansible.builtin.import_tasks: ../common/handlers.yml

  tasks:
    - name: Install WireGuard configuration
      ansible.builtin.template:
        src: wg0.conf
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify:
        - Restart wg-quick@wg0

    - name: Allow WireGuard
      ansible.posix.firewalld:
        zone: public
        port: "{{ wireguard_listen_port }}/udp"
        permanent: true
        immediate: true
        state: enabled
      tags:
        - skip_ansible_lint

    - name: Add wg0 to public zone
      ansible.posix.firewalld:
        zone: public
        interface: wg0
        permanent: true
        immediate: true
        state: enabled
      tags:
        - skip_ansible_lint

    - name: Enable wg-quick@wg0
      ansible.builtin.service:
        name: wg-quick@wg0
        enabled: true
        state: started
