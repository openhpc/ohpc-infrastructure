- name: OpenHPC Huawei jumper
  hosts: ohpc_huawei_jumper
  become: true
  gather_facts: true

  handlers:
    - name: Include handlers
      ansible.builtin.import_tasks: ../common/handlers.yml

  tasks:
    - name: Include history.yml
      ansible.builtin.include_tasks: ../common/history.yml

    - name: Install packages
      ansible.builtin.package:
        state: present
        name:
          - ipmitool
          - rsync

    - name: Import common Huawei file
      ansible.builtin.import_tasks: ohpc-huawei-common.yml

    # repos.openhpc.community pulls the CI results of this lab through
    # this host (pull-results@ohpc-huawei-repo.timer). The key is
    # generated by roles/repos/repos-aarch64.yml and may only forward
    # to the repo server, it gets no shell here.
    - name: Allow the results-sync key to forward to ohpc-huawei-repo
      ansible.posix.authorized_key:
        user: root
        key: "{{ lookup('file', 'results-sync.pub') }}"
        key_options: 'restrict,port-forwarding,permitopen="ohpc-huawei-repo:22"'
