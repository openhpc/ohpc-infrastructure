- name: OpenHPC Huawei jumper
  hosts: ohpc_huawei_jumper
  become: true
  gather_facts: true
  vars:
    # The name of the connection profile in the menu of UniVPNCS.
    univpn_connection: hpc
    # The VPN tunnel counts as up while at least one of the hosts answers
    # a ping. All hosts are only reachable through the tunnel.
    univpn_check_hosts:
      # ohpc-huawei-repo
      - 192.168.29.56
      # mohpc-huawei-repo
      - 192.168.28.56
      # mohpc-huawei-sms
      - 192.168.28.54

  handlers:
    - name: Include handlers
      ansible.builtin.import_tasks: ../common/handlers.yml

  tasks:
    - name: Include history.yml
      ansible.builtin.include_tasks: ../common/history.yml

    - name: Install packages
      ansible.builtin.package:
        state: present
        name:
          - expect
          - ipmitool
          - rsync

    - name: Import common Huawei file
      ansible.builtin.import_tasks: ohpc-huawei-common.yml

    # repos.openhpc.community pulls the CI results of this lab through
    # this host (pull-results@ohpc-huawei-repo.timer). The key is
    # generated by roles/repos/repos-aarch64.yml and may only forward
    # to the repo server, it gets no shell here.
    - name: Allow the results-sync key to forward to ohpc-huawei-repo
      ansible.posix.authorized_key:
        user: root
        key: "{{ lookup('file', 'results-sync.pub') }}"
        key_options: 'restrict,port-forwarding,permitopen="ohpc-huawei-repo:22"'

    # univpn.service logs in to the Huawei lab VPN with the UniVPN
    # command-line client and reconnects when the tunnel is down. The
    # service needs /etc/univpn.env (mode 0600) with the lines
    # VPN_USER=... and VPN_PASS=..., which is created by hand on the host
    # to keep the credentials out of this repository. The service is
    # enabled but not started here, because starting it while a client
    # runs in a tmux session fails.
    #
    #   status:        systemctl status univpn / journalctl -u univpn -f
    #   stop / start:  systemctl stop|start univpn
    #   credentials:   edit /etc/univpn.env, then systemctl restart univpn
    - name: Create /opt/univpn
      ansible.builtin.file:
        path: /opt/univpn
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Install UniVPN reconnect scripts
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /opt/univpn/
        owner: root
        group: root
        mode: "0750"
      loop:
        - univpn-connect.exp
        - univpn-watchdog.sh

    - name: Install univpn.service
      ansible.builtin.template:
        src: univpn.service
        dest: /etc/systemd/system/univpn.service
        owner: root
        group: root
        mode: "0644"
      notify: Systemd daemon-reload

    - name: Enable univpn.service
      ansible.builtin.systemd_service:
        name: univpn
        enabled: true
        daemon_reload: true
      ignore_errors: "{{ ansible_check_mode }}"
